<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>NEON JUMP 🐱 v3</title>
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; background:#050010;
  font-family:-apple-system,'Segoe UI',Roboto,monospace;
  overflow:hidden; user-select:none; touch-action:none; }

#cv-bg { position:fixed; inset:0; z-index:1; }
#cv-fx { position:fixed; inset:0; z-index:2; pointer-events:none;
  mix-blend-mode:screen; opacity:0.85; }
#cv { position:fixed; inset:0; z-index:3; }

.hud { position:fixed; inset:0; pointer-events:none; z-index:5; }
.hud .lbl { position:absolute; font-weight:bold;
  text-shadow:0 0 12px currentColor, 0 0 4px #000;
  white-space:nowrap; font-family:'Courier New',monospace; letter-spacing:1px; }
#score { top:10px; left:16px; color:#a8f7ff; font-size:34px;
  text-shadow:0 0 24px #00e5ff, 0 0 12px #00e5ff, 0 0 4px #fff; }
#best  { top:54px; left:18px; color:#ff9cf5; font-size:12px;
  text-shadow:0 0 12px #ff00e5; letter-spacing:2px; }
#coins { top:10px; right:16px; color:#ffe56b; font-size:18px; text-align:right;
  text-shadow:0 0 16px #ffcc00, 0 0 6px #ffcc00; }
#multi { top:36px; right:16px; color:#8fffcf; font-size:12px; text-align:right;
  text-shadow:0 0 12px #00ff88; }
#status { top:10px; left:50%; transform:translateX(-50%); color:#fff; font-size:12px;
  text-align:center; max-width:36vw; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; opacity:0.8; letter-spacing:2px; }

.sbtn { position:fixed; right:8px; width:100px; height:28px; pointer-events:auto;
  background:linear-gradient(135deg, rgba(20,10,40,0.75), rgba(40,20,60,0.75));
  color:#a8f7ff; border:1px solid rgba(0,229,255,0.5);
  border-radius:10px; font-size:11px; font-weight:bold; cursor:pointer;
  font-family:inherit; z-index:6; letter-spacing:1.5px;
  text-shadow:0 0 8px currentColor;
  box-shadow:0 0 16px rgba(0,229,255,0.3), inset 0 0 12px rgba(0,229,255,0.05);
  transition:all 0.25s cubic-bezier(0.4,0,0.2,1);
  backdrop-filter:blur(8px); }
.sbtn:hover { transform:translateX(-3px);
  background:linear-gradient(135deg, rgba(0,229,255,0.25), rgba(255,0,229,0.15));
  box-shadow:0 0 24px rgba(0,229,255,0.7), inset 0 0 16px rgba(0,229,255,0.15); }
.sbtn.pink  { border-color:rgba(255,0,229,0.5); color:#ff9cf5;
  box-shadow:0 0 16px rgba(255,0,229,0.3), inset 0 0 12px rgba(255,0,229,0.05); }
.sbtn.pink:hover  { background:linear-gradient(135deg, rgba(255,0,229,0.25), rgba(0,229,255,0.15));
  box-shadow:0 0 24px rgba(255,0,229,0.7), inset 0 0 16px rgba(255,0,229,0.15); }
.sbtn.green { border-color:rgba(0,255,136,0.5); color:#8fffcf;
  box-shadow:0 0 16px rgba(0,255,136,0.3), inset 0 0 12px rgba(0,255,136,0.05); }
.sbtn.green:hover { background:linear-gradient(135deg, rgba(0,255,136,0.25), rgba(0,229,255,0.15));
  box-shadow:0 0 24px rgba(0,255,136,0.7), inset 0 0 16px rgba(0,255,136,0.15); }
.sbtn.gold  { border-color:rgba(255,229,107,0.5); color:#ffe56b;
  box-shadow:0 0 16px rgba(255,229,107,0.3), inset 0 0 12px rgba(255,229,107,0.05); }
.sbtn.gold:hover  { background:linear-gradient(135deg, rgba(255,229,107,0.25), rgba(255,136,0,0.15));
  box-shadow:0 0 24px rgba(255,229,107,0.7), inset 0 0 16px rgba(255,229,107,0.15); }

#btnPause  { top:76px;  }
#btnShop   { top:108px; }
#btnSkins  { top:140px; }
#btnAch    { top:172px; }
#btnGyro   { top:204px; }

.panel { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  background:linear-gradient(160deg, rgba(20,5,40,0.97), rgba(10,0,30,0.99));
  border:2px solid rgba(0,229,255,0.7); border-radius:20px;
  box-shadow:0 0 80px rgba(0,229,255,0.5), 0 0 40px rgba(0,229,255,0.3), inset 0 0 40px rgba(0,229,255,0.08);
  display:none; z-index:20; padding:24px; max-width:95vw; max-height:90vh;
  overflow-y:auto; color:#fff; backdrop-filter:blur(14px); }
.panel.show { display:block; animation:popIn 0.3s cubic-bezier(0.34,1.56,0.64,1); }
@keyframes popIn {
  from { opacity:0; transform:translate(-50%,-50%) scale(0.85); }
  to   { opacity:1; transform:translate(-50%,-50%) scale(1); }
}
.panel h2 { color:#a8f7ff; text-align:center; font-size:18px; letter-spacing:5px;
  margin-bottom:18px; text-shadow:0 0 20px currentColor, 0 0 8px currentColor;
  font-family:'Courier New',monospace; }
.panel .x { position:absolute; top:12px; right:12px; width:34px; height:34px;
  background:transparent; color:#ff9cf5; border:1px solid rgba(255,0,229,0.6);
  border-radius:10px; font-size:16px; font-weight:bold; cursor:pointer;
  box-shadow:0 0 16px rgba(255,0,229,0.5); transition:all 0.2s; }
.panel .x:hover { background:rgba(255,0,229,0.25); transform:rotate(90deg); }

#shop { border-color:rgba(255,229,107,0.7);
  box-shadow:0 0 80px rgba(255,229,107,0.5), inset 0 0 40px rgba(255,229,107,0.08);
  width:520px; }
#shop h2 { color:#ffe56b; text-shadow:0 0 20px currentColor; }
#shop .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
#shop .ub { padding:14px 10px; background:linear-gradient(135deg, rgba(40,25,10,0.85), rgba(60,35,10,0.75));
  border:1px solid rgba(255,229,107,0.5); color:#ffe56b; border-radius:12px;
  font-size:11px; cursor:pointer; font-family:inherit; white-space:pre-line;
  line-height:1.5; transition:all 0.25s cubic-bezier(0.4,0,0.2,1);
  box-shadow:inset 0 0 16px rgba(255,229,107,0.05); }
#shop .ub.ok { background:linear-gradient(135deg, rgba(20,50,30,0.85), rgba(10,40,20,0.75));
  border-color:rgba(0,255,136,0.7); color:#8fffcf;
  box-shadow:0 0 16px rgba(0,255,136,0.3), inset 0 0 16px rgba(0,255,136,0.08); }
#shop .ub.ok:hover { transform:translateY(-4px) scale(1.02);
  box-shadow:0 8px 30px rgba(0,255,136,0.6), inset 0 0 20px rgba(0,255,136,0.2); }
#shop .ub.no { opacity:0.35; cursor:not-allowed; }

#skins { border-color:rgba(255,0,229,0.7);
  box-shadow:0 0 80px rgba(255,0,229,0.5), inset 0 0 40px rgba(255,0,229,0.08);
  width:580px; }
#skins h2 { color:#ff9cf5; text-shadow:0 0 20px currentColor; }
#skins .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
#skins .sk { padding:16px 8px; border:1px solid rgba(255,0,229,0.5);
  background:linear-gradient(135deg, rgba(40,10,50,0.65), rgba(20,5,30,0.65));
  color:#fff; border-radius:14px; font-size:11px; cursor:pointer;
  font-family:inherit; text-align:center; white-space:pre-line;
  line-height:1.4; transition:all 0.25s cubic-bezier(0.34,1.56,0.64,1);
  box-shadow:inset 0 0 16px rgba(255,0,229,0.05); }
#skins .sk:hover { transform:translateY(-5px) scale(1.03);
  box-shadow:0 10px 30px rgba(255,0,229,0.5), inset 0 0 20px rgba(255,0,229,0.15); }
#skins .sk.eq { background:linear-gradient(135deg, rgba(0,255,136,0.25), rgba(0,180,100,0.15));
  border-color:#00ff88;
  box-shadow:0 0 24px rgba(0,255,136,0.7), inset 0 0 20px rgba(0,255,136,0.15); }
#skins .sk.owned { background:linear-gradient(135deg, rgba(0,229,255,0.18), rgba(0,150,200,0.12));
  border-color:#00e5ff; }
#skins .sk.buy { background:linear-gradient(135deg, rgba(60,20,60,0.6), rgba(30,10,40,0.6)); }
#skins .sk .emoji { font-size:30px; display:block; margin-bottom:8px;
  filter:drop-shadow(0 0 12px rgba(255,255,255,0.5)); }

#ach { border-color:rgba(0,255,136,0.7);
  box-shadow:0 0 80px rgba(0,255,136,0.5), inset 0 0 40px rgba(0,255,136,0.08);
  width:580px; }
#ach h2 { color:#8fffcf; text-shadow:0 0 20px currentColor; }
#ach .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; font-size:11px; }
#ach .it { padding:12px 14px; border-radius:10px;
  background:linear-gradient(135deg, rgba(20,30,20,0.6), rgba(15,25,15,0.6));
  color:#557766; font-family:'Courier New',monospace;
  border:1px solid rgba(40,60,40,0.5); transition:all 0.25s; }
#ach .it.on { color:#8fffcf;
  background:linear-gradient(135deg, rgba(0,255,136,0.18), rgba(0,180,100,0.1));
  border-color:#00ff88; text-shadow:0 0 10px currentColor;
  box-shadow:0 0 20px rgba(0,255,136,0.4), inset 0 0 16px rgba(0,255,136,0.08); }

#over { border-color:rgba(255,0,229,0.7);
  box-shadow:0 0 100px rgba(255,0,229,0.8), inset 0 0 40px rgba(255,0,229,0.1);
  width:400px; text-align:center; }
#over h1 { color:#ff9cf5; font-size:22px; letter-spacing:6px; margin:10px 0 22px;
  text-shadow:0 0 30px currentColor, 0 0 12px currentColor;
  font-family:'Courier New',monospace;
  animation:glitch 0.5s ease; }
@keyframes glitch {
  0% { text-shadow:3px 0 #00e5ff, -3px 0 #ff00e5, 0 0 30px currentColor; }
  50% { text-shadow:-3px 0 #00e5ff, 3px 0 #ff00e5, 0 0 30px currentColor; }
  100% { text-shadow:0 0 30px currentColor, 0 0 12px currentColor; }
}
#over .s { color:#a8f7ff; font-size:42px; margin:10px 0;
  font-family:'Courier New',monospace;
  text-shadow:0 0 30px currentColor, 0 0 12px currentColor, 0 0 4px #fff; }
#over .b { color:#c0d0ff; font-size:13px; margin-bottom:6px; letter-spacing:1px; }
#over .c { color:#ffe56b; font-size:16px; margin-bottom:24px;
  text-shadow:0 0 16px #ffcc00, 0 0 6px #ffcc00; }
#over button { display:block; width:100%; padding:16px; margin-bottom:10px;
  background:linear-gradient(135deg, #00e5ff, #ff00e5); color:#fff; border:none;
  border-radius:14px; font-size:15px; font-weight:bold; cursor:pointer;
  font-family:inherit; letter-spacing:3px;
  box-shadow:0 8px 30px rgba(0,229,255,0.5), 0 0 20px rgba(255,0,229,0.3),
             inset 0 0 24px rgba(255,255,255,0.2);
  text-shadow:0 0 12px rgba(0,0,0,0.6); transition:all 0.25s; }
#over button:hover { transform:translateY(-3px) scale(1.02);
  box-shadow:0 12px 40px rgba(255,0,229,0.8), inset 0 0 30px rgba(255,255,255,0.3); }
#over .b2 { background:linear-gradient(135deg, #ffe56b, #ff8800);
  box-shadow:0 8px 30px rgba(255,200,60,0.5), inset 0 0 24px rgba(255,255,255,0.2); }
#over .b3 { background:linear-gradient(135deg, #00ff88, #00b3ff);
  box-shadow:0 8px 30px rgba(0,255,136,0.5), inset 0 0 24px rgba(255,255,255,0.2); }

#gyro-modal { border-color:rgba(0,255,136,0.8);
  box-shadow:0 0 80px rgba(0,255,136,0.7), inset 0 0 40px rgba(0,255,136,0.1);
  width:360px; text-align:center; }
#gyro-modal h2 { color:#8fffcf; font-size:16px;
  text-shadow:0 0 16px currentColor; }
#gyro-modal p { color:#cceecc; font-size:13px; margin-bottom:22px;
  line-height:1.7; letter-spacing:0.5px; }
#gyro-modal button { padding:16px 34px;
  background:linear-gradient(135deg, #00ff88, #00b3ff);
  color:#000; border:none; border-radius:12px; font-size:15px; font-weight:bold;
  cursor:pointer; font-family:inherit; letter-spacing:3px;
  box-shadow:0 8px 30px rgba(0,255,136,0.6), inset 0 0 20px rgba(255,255,255,0.3);
  transition:all 0.25s; }
#gyro-modal button:hover { transform:translateY(-3px);
  box-shadow:0 12px 40px rgba(0,255,136,0.8); }

#toast { position:fixed; top:20%; left:50%; transform:translateX(-50%);
  background:linear-gradient(135deg, rgba(20,5,40,0.96), rgba(40,10,60,0.96));
  color:#a8f7ff; padding:14px 28px; border-radius:14px;
  font-size:14px; font-weight:bold; opacity:0;
  transition:opacity 0.4s cubic-bezier(0.4,0,0.2,1),
             transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
  pointer-events:none; z-index:30;
  border:1px solid rgba(0,229,255,0.7);
  font-family:'Courier New',monospace; letter-spacing:2px;
  text-shadow:0 0 12px currentColor;
  box-shadow:0 0 40px rgba(0,229,255,0.6), inset 0 0 20px rgba(0,229,255,0.1);
  max-width:80vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  backdrop-filter:blur(12px); }
#toast.on { opacity:1; transform:translateX(-50%) translateY(6px) scale(1.05); }

@media (max-width:600px) {
  .sbtn { width:80px; font-size:10px; height:26px; }
  #score { font-size:28px; } #best { font-size:11px; }
  #coins { font-size:16px; } #multi { font-size:11px; }
  #status { font-size:11px; }
  #skins .grid { grid-template-columns:repeat(2,1fr); }
  #ach .grid { grid-template-columns:1fr; }
  #over { width:340px; }
  #over .s { font-size:34px; }
}
</style>
</head>
<body>

<canvas id="cv-bg"></canvas>
<canvas id="cv-fx"></canvas>
<canvas id="cv"></canvas>

<div class="hud">
  <div class="lbl" id="score">0</div>
  <div class="lbl" id="best">РЕКОРД: 0</div>
  <div class="lbl" id="coins">💰 0</div>
  <div class="lbl" id="multi"></div>
  <div class="lbl" id="status"></div>
</div>

<button class="sbtn pink"  id="btnPause">II ПАУЗА</button>
<button class="sbtn gold"  id="btnShop">🛒 МАГАЗИН</button>
<button class="sbtn pink"  id="btnSkins">🐱 СКИНЫ</button>
<button class="sbtn green" id="btnAch">🏆 АЧИВКИ</button>
<button class="sbtn green" id="btnGyro">📱 ГИРО</button>

<div class="panel" id="shop">
  <button class="x" data-close="shop">✕</button>
  <h2>🛒 МАГАЗИН</h2>
  <div class="row" id="shop-row"></div>
</div>

<div class="panel" id="skins">
  <button class="x" data-close="skins">✕</button>
  <h2>🐱 СКИНЫ</h2>
  <div class="grid" id="skins-list"></div>
</div>

<div class="panel" id="ach">
  <button class="x" data-close="ach">✕</button>
  <h2>🏆 АЧИВКИ</h2>
  <div class="grid" id="ach-list"></div>
</div>

<div class="panel" id="over">
  <h1 id="o-title">GAME OVER</h1>
  <div class="s" id="o-score">0</div>
  <div class="b" id="o-best">РЕКОРД: 0</div>
  <div class="c" id="o-coins">+0 💰</div>
  <button id="o-restart">ИГРАТЬ</button>
  <button class="b2" id="o-revive">ПРОДОЛЖИТЬ (реклама)</button>
  <button class="b3" id="o-leader">ЛИДЕРБОРД</button>
</div>

<div class="panel" id="gyro-modal">
  <h2>📱 НАКЛОН УСТРОЙСТВА</h2>
  <p>Наклоняй телефон влево-вправо, чтобы двигать котёнка.<br>Разрешить использование гироскопа?</p>
  <button id="gyro-allow">РАЗРЕШИТЬ</button>
  <button id="gyro-deny" style="background:transparent;color:#888;margin-top:12px;box-shadow:none;border:none;font-size:12px;padding:6px;letter-spacing:1px;">Не сейчас</button>
</div>

<div id="toast"></div>

<script src="game.js"></script>
</body>
</html>
